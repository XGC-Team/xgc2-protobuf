name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    name: Source generation and cross-language tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint, generate, and test in the XGC2 jammy image
        env:
          XGC2_GO_PROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail
          image=ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
          docker pull "${image}"
          docker run --rm \
            -e XGC2_GO_PROXY \
            -e GITHUB_BASE_REF \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            "${image}" \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              tools/install-go-plugins.sh
              buf lint
              if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
                tools/check-breaking.sh "origin/${GITHUB_BASE_REF}"
              fi
              tools/smoke-test.sh
            '
          git diff --check HEAD
          test -z "$(git status --short --untracked-files=no)"

  package-compliance:
    name: Package compliance
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check whitespace and package contract
        run: |
          set -euo pipefail
          git diff --check HEAD
          docker pull ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
          docker run --rm --network none \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0 \
            bash -lc './.xgc2/scripts/check_package_compliance.sh'

  deb-build-and-smoke:
    name: Debian ${{ matrix.distribution }} (Architecture all)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: focal
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
          - distribution: jammy
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
          - distribution: noble
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build deb and run installed smoke test
        run: |
          set -euo pipefail
          install -d .ci/build-manifests
          docker run --rm --network none \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e PACKAGE_DISTRIBUTION="${{ matrix.distribution }}" \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              for pkg in ca-certificates cmake dpkg-dev fakeroot git make \
                pkg-config protobuf-compiler python3 python3-protobuf python3-yaml
              do
                dpkg -s "${pkg}" >/dev/null
              done
              git config --global --add safe.directory /work
              ./.xgc2/scripts/check_package_compliance.sh
              ./.xgc2/scripts/build_deb.sh
              dpkg -i ./debs/xgc2-protobuf-dev_*.deb
              ./.xgc2/scripts/smoke_test_installed.sh
            '

      - name: Create trusted build manifests
        run: |
          set -euo pipefail
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          for architecture in amd64 arm64; do
            python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
              --deb-dir debs \
              --output-dir .ci/build-manifests \
              --product xgc2-protobuf \
              --product-version "${product_version}" \
              --distribution "${{ matrix.distribution }}" \
              --architecture "${architecture}" \
              --source-sha "${GITHUB_SHA}" \
              --ci-run-id "${GITHUB_RUN_ID}" \
              --ci-workflow "${GITHUB_WORKFLOW}" \
              --ci-workflow-ref "${GITHUB_WORKFLOW_REF}"
          done

      - name: Upload trusted deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-protobuf-${{ matrix.distribution }}-all
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
