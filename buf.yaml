version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # These JSON enum names are already the cross-language telemetry contract.
  # Scope the nested-enum prefix exception to this one schema instead of
  # weakening the repository-wide STANDARD lint policy.
  ignore_only:
    ENUM_VALUE_PREFIX:
      - proto/xgc/semantic/common/v1/telemetry.proto
    # Reset's native REASON_NONE=0 means a known absence of a reason. Keep
    # that wire meaning instead of renaming it to an unknown/unspecified state.
    ENUM_ZERO_VALUE_SUFFIX:
      - proto/xgc/semantic/ground/v1/reset.proto
breaking:
  use:
    - FILE
