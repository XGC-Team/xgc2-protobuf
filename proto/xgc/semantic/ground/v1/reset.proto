syntax = "proto3";

package xgc.semantic.ground.v1;

option go_package = "xgc2/protocols/xgc/semantic/ground/v1;groundv1";

enum ResetPhase {
  RESET_PHASE_UNSPECIFIED = 0;
  RESET_PHASE_IDLE = 1;
  RESET_PHASE_REQUESTING = 2;
  RESET_PHASE_WAITING = 3;
  RESET_PHASE_MOVING = 4;
  RESET_PHASE_SETTLING = 5;
  RESET_PHASE_DONE = 6;
}

enum ResetOutcome {
  RESET_OUTCOME_UNSPECIFIED = 0;
  RESET_OUTCOME_ARRIVED = 1;
  RESET_OUTCOME_TIMEOUT = 2;
  RESET_OUTCOME_STOPPED = 3;
  RESET_OUTCOME_REJECTED_NO_TARGET = 10;
  RESET_OUTCOME_REJECTED_NO_COORDINATOR = 11;
  RESET_OUTCOME_REJECTED_BY_COORDINATOR = 12;
  RESET_OUTCOME_INFEASIBLE = 20;
  RESET_OUTCOME_ABORTED_DEVIATION = 30;
  RESET_OUTCOME_ABORTED_STALLED = 31;
  RESET_OUTCOME_ABORTED_COORDINATOR_LOST = 32;
  RESET_OUTCOME_ABORTED_UNHEALTHY = 33;
}

enum ResetReason {
  RESET_REASON_NONE = 0;
  RESET_REASON_WAITING_FOR_PEER = 1;
  RESET_REASON_PRECEDENCE = 2;
  RESET_REASON_REPLAN = 3;
  RESET_REASON_SCENE_UNAVAILABLE = 4;
  RESET_REASON_NON_PARTICIPANT_MOVING = 5;
  RESET_REASON_GOAL_OCCUPIED = 20;
  RESET_REASON_NO_ROUTE = 21;
  RESET_REASON_DEADLOCK = 22;
  RESET_REASON_TOO_SLOW = 23;
  RESET_REASON_BAD_SESSION = 24;
  RESET_REASON_STALLED = 25;
  RESET_REASON_SCENE_CHANGED = 26;
}

// Terminal outcome of one vehicle Reset session, projected from latched
// {ns}/reset/result only when its session counter matches ResetStatus.generation.
message ResetResult {
  ResetOutcome outcome = 1;
  ResetReason reason = 2;
  double final_planar_error_m = 3;
  double final_yaw_error_rad = 4;
  double duration_s = 5;
  string detail = 6;
  sfixed64 source_stamp_ns = 7;
}

// Ground vehicle Reset session observation projected from {ns}/reset/session
// (5 Hz and on change) with the matching session's latched {ns}/reset/result.
message ResetStatus {
  uint32 generation = 1;
  ResetPhase phase = 2;
  ResetResult result = 3;
}
