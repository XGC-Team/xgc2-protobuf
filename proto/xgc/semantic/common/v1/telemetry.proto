syntax = "proto3";

package xgc.semantic.common.v1;

option go_package = "xgc2/protocols/xgc/semantic/common/v1;commonv1";

import "xgc/semantic/common/v1/types.proto";

message PoseEstimate {
  string frame_id = 1;
  string child_frame_id = 2;
  Vector3 position = 3;
  Quaternion orientation = 4;
  repeated double covariance = 5;
}

message VelocityEstimate {
  string frame_id = 1;
  Vector3 linear = 2;
  Vector3 angular = 3;
  repeated double covariance = 4;
}

// Scalar translational speed derived by the producer in frame_id. The value
// may be signed when it represents velocity along a directed frame axis.
message SpeedEstimate {
  string frame_id = 1;
  double meters_per_second = 2;
}

// Scalar Euclidean distance between two positions in the same frame.
message DistanceEstimate {
  string frame_id = 1;
  double meters = 2;
}

message ImuEstimate {
  string frame_id = 1;
  Quaternion orientation = 2;
  Vector3 angular_velocity = 3;
  Vector3 linear_acceleration = 4;
  repeated double orientation_covariance = 5;
  repeated double angular_velocity_covariance = 6;
  repeated double linear_acceleration_covariance = 7;
}

message PowerStatus {
  enum PercentageState {
    PERCENTAGE_STATE_UNSPECIFIED = 0;
    PERCENTAGE_STATE_AVAILABLE = 1;
    PERCENTAGE_STATE_UNAVAILABLE = 2;
  }

  double percentage = 1;
  double voltage_v = 2;
  double current_a = 3;
  double temperature_c = 4;
  bool charging = 5;
  PercentageState percentage_state = 6;
}

message PositioningHealth {
  enum State {
    POSITIONING_STATE_UNSPECIFIED = 0;
    POSITIONING_STATE_WARMING_UP = 1;
    POSITIONING_STATE_STABLE = 2;
    POSITIONING_STATE_JITTERING = 3;
    POSITIONING_STATE_MOVING = 4;
    POSITIONING_STATE_TIMED_OUT = 5;
    // The source is fresh and the configured repeat-frame window contains
    // enough natural variation to prove that it is not replaying a frozen
    // pose. This is intentionally distinct from robot motion.
    POSITIONING_STATE_ACTIVE = 6;
    // Messages are still arriving, but the configured repeat-frame detector
    // found no qualifying variation on the admitted axes.
    POSITIONING_STATE_FROZEN = 7;
  }

  enum Reason {
    POSITIONING_REASON_UNSPECIFIED = 0;
    POSITIONING_REASON_INSUFFICIENT_SAMPLES = 1;
    POSITIONING_REASON_STATIONARY_WINDOW_STABLE = 2;
    POSITIONING_REASON_STATIONARY_JITTER_EXCEEDED = 3;
    POSITIONING_REASON_ROBOT_MOVING = 4;
    POSITIONING_REASON_VRPN_TIMEOUT = 5;
    POSITIONING_REASON_WINDOW_VARIATION_OBSERVED = 6;
    POSITIONING_REASON_REPEAT_FRAME_WINDOW_FROZEN = 7;
  }

  State state = 1;
  Reason reason = 2;
  uint64 observed_age_ms = 3;
  double window_spread_m = 4;
  uint32 sample_count = 5;
}

message VehicleHealth {
  bool online = 1;
  string summary = 2;
  repeated Fault faults = 3;
  PositioningHealth positioning = 4;
}

message ChannelHealth {
  string channel_id = 1;
  double source_rate_hz = 2;
  double output_rate_hz = 3;
  uint64 dropped_samples = 4;
  uint64 source_age_ms = 5;
  bool stale = 6;
}

// StreamHealthReport transports one coherent health sample for every stream
// observed by an Adapter. A single report avoids several entries competing for
// the same latest-value channel in Core.
message StreamHealthReport {
  repeated ChannelHealth channels = 1;
}
